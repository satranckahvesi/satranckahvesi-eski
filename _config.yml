title: Satranç Kahvesi
description: Kahve eşliğinde satranç sohbetleri
lang: tr
# The logo is the publisher logo in the structured data.
logo: /assets/img/icon-512.png
# Link previews (WhatsApp etc.) use a wide 1200x630 card, not the square logo.
twitter:
  card: summary_large_image
baseurl: ""
url: "https://satranckahvesi.com"
google_analytics: G-EQR45VG5M7

# New-post notifications (Web Push). Leave both empty to hide the footer button; see
# scripts/push/README.md for how to fill them in.
push:
  endpoint: "https://script.google.com/macros/s/AKfycbxRNzMSunM3CqR3LGF93KikhXR-r1VgCQbMwGiyze4X5k6YqxyKvFnEWaqu-_He7XFZ/exec"  # Apps Script web app URL (ends in /exec)
  public_key: "BJQ31F69KdKyUDcDrH7AtSQQpK-lNsxMM4zjzxIgReIgYcxUkak-UKiHuUR3kZUhd6u6k57q0lEyP3e9hmNAdms"  # VAPID public key

markdown: kramdown
permalink: /posts/:title/
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    hellip: "..."
    mdash: "---"
    ndash: "--"

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - eslint.config.js
  - docs/
  - satranca-ilk-adim/
  - tests/
  - README.md
  - scripts/
  - vendor/
  - node_modules/

# Leading chess titles that are not part of a person's name (author initials).
chess_titles: [FM, GM, IM, CM, WFM, WGM, WIM, WCM, NM, AGM, AIM]

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/share.png
        width: 1200
        height: 630
        alt: Satranç Kahvesi logosu
